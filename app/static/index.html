<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多智能体深度研究报告生成器</title>
<script src="/static/marked.min.js"></script>
<style>
  :root { --bg:#f4f4ef; --left:#f7f2e8; --right:#ffffff; --panel:#ffffff; --line:#e2ddd3;
          --text:#2d2a26; --muted:#7c7569; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
          --shadow: 0 1px 3px rgba(0,0,0,.06); }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .wrap { display:grid; grid-template-columns: 360px 1fr; gap:16px; padding:16px 24px; flex:1; align-items:stretch; min-height:0; }
  @media (max-width: 900px){ .wrap { grid-template-columns:1fr; } }
  .card { border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:var(--shadow);
          display:flex; flex-direction:column; height:100%; overflow:hidden; }
  .left { background:var(--left); }
  .right { background:var(--right); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; font-weight:600; }
  input, select { width:100%; padding:9px 10px; background:#ffffff; color:var(--text);
                  border:1px solid #d6cfc3; border-radius:7px; font-size:14px; outline:none; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(37,99,235,.12); }
  button { margin-top:14px; width:100%; padding:11px; border:0; border-radius:7px;
           background:var(--accent); color:#ffffff; font-weight:700; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .exports { margin-top:14px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .xbtn { width:auto; margin-top:0; padding:6px 12px; font-size:13px; background:var(--panel); color:var(--accent);
          border:1px solid var(--accent); border-radius:7px; cursor:pointer; }
  .xbtn:hover { background:var(--accent); color:#fff; }
  .roles { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .chip { font-size:12px; padding:4px 9px; border-radius:999px; border:1px solid #d6cfc3;
          color:var(--muted); background:#ffffff; transition:.2s; }
  .chip.active { background:var(--accent); color:#ffffff; border-color:var(--accent); }
  .chip.done { background:#dcfce7; color:#166534; border-color:#dcfce7; }
  .log { flex:1; min-height:140px; overflow:auto; font-family: ui-monospace, Consolas, monospace;
         font-size:12px; line-height:1.6; background:#fffefb; border:1px solid #e8e3d8;
         border-radius:8px; padding:10px; white-space:pre-wrap; color:var(--text); }
  .log .t { color:var(--muted); }
  .log .n { color:var(--accent); }
  .metrics { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
  .metric { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;
            padding:8px 12px; font-size:13px; color:#374151; }
  .metric b { color:var(--accent); }
  #report { flex:1; min-height:180px; margin-top:12px; padding:20px; background:#ffffff; border:1px solid #e2e8f0;
            border-radius:8px; line-height:1.75; font-size:14px; overflow:auto; color:#1f2937; }
  #report h1,#report h2,#report h3 { color:#1e3a8a; margin-top:1.2em; margin-bottom:.6em; }
  #report code { background:#f1f5f9; padding:2px 6px; border-radius:4px; color:#334155; }
  #report pre { background:#f8fafc; padding:12px; border-radius:8px; overflow:auto; }
  #report a { color:var(--accent); text-decoration:none; }
  #report a:hover { text-decoration:underline; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>🤖 多智能体深度研究报告生成器</h1>
  <p>输入主题 → Planner 分解 → Researcher / Analyst 并行 → Writer 成文 → Critic 质量门迭代</p>
</header>

<div class="wrap">
  <!-- 左：控制面板 -->
  <div class="card left">
    <label>报告主题</label>
    <input id="goal" value="对比 LangGraph 与 AutoGen 的优缺点" />

    <label>模型供应商</label>
    <select id="provider">
      <option value="mock">mock（离线，免 Key）</option>
      <option value="openai">openai</option>
      <option value="deepseek">deepseek（DeepSeek）</option>
      <option value="qwen">qwen（通义千问）</option>
      <option value="hunyuan">hunyuan（混元）</option>
    </select>

    <label>质量门最大迭代次数</label>
    <input id="max_iteration" type="number" value="3" min="1" max="10" />

    <label>API Key（可选，仅 openai / qwen / deepseek 需要）</label>
    <input id="api_key" type="password" placeholder="sk-... 留空则读 .env" autocomplete="off" />
    <label>Base URL（可选）</label>
    <input id="base_url" placeholder="留空用默认值" autocomplete="off" />

    <label>文档目录（可选，RAG 用）</label>
    <input id="docs_dir" placeholder="如 D:/docs，留空则不用私有文档" autocomplete="off" />

    <button id="go">▶ 生成报告</button>
    <div class="exports">
      <span class="hint">导出：</span>
      <button type="button" class="xbtn" data-fmt="pdf">PDF</button>
      <button type="button" class="xbtn" data-fmt="pptx">PPTX</button>
      <button type="button" class="xbtn" data-fmt="json">JSON</button>
      <button type="button" class="xbtn" data-fmt="md">MD</button>
    </div>
    <div class="hint">默认 mock 模式无需任何 API Key 即可运行。</div>

    <div class="roles" id="roles">
      <span class="chip" data-r="planner">Planner</span>
      <span class="chip" data-r="dispatcher">Dispatcher</span>
      <span class="chip" data-r="researcher">Researcher</span>
      <span class="chip" data-r="analyst">Analyst</span>
      <span class="chip" data-r="writer">Writer</span>
      <span class="chip" data-r="critic">Critic</span>
    </div>

    <label style="margin-top:16px;">实时执行日志</label>
    <div class="log" id="log">等待开始…</div>
  </div>

  <!-- 右：报告 + 指标 -->
  <div class="card right">
    <div class="metrics" id="metrics"></div>
    <div id="report"><p class="hint">报告将在此处渲染。点击「生成报告」开始。</p></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log");
const roles = $("#roles");
let lastReport = "";
let lastMetrics = {};

function ts() {
  const d = new Date();
  return d.toTimeString().slice(0, 8);
}
function appendLog(text, cls = "") {
  if (log.textContent.trim() === "等待开始…") log.textContent = "";
  const line = document.createElement("div");
  line.innerHTML = `<span class="t">[${ts()}]</span> <span class="${cls}">${text}</span>`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}
function setRole(r, state) {
  const el = roles.querySelector(`[data-r="${r}"]`);
  if (!el) return;
  el.classList.remove("active", "done");
  if (state) el.classList.add(state);
  if (state === "active") appendLog(`▶ ${r} 开始`, "n");
  if (state === "done") appendLog(`✓ ${r} 完成 (${el.dataset.ms ?? ""})`, "n");
}

function renderMetrics(m) {
  const c = m.cost || {};
  const items = [
    ["迭代轮数", m.iterations],
    ["达标", m.passed ? "是 ✅" : "否 ⚠️"],
    ["Critic 分", `${m.score}/40`],
    ["检索片段", m.ingested ?? "-"],
    ["成本", `¥${c.cost_cny}`],
    ["Token", c.total_tokens ?? "-"],
    ["耗时", `${m.elapsed_s}s`],
  ];
  $("#metrics").innerHTML = items
    .map(([k, v]) => `<div class="metric">${k}: <b>${v}</b></div>`)
    .join("");
}

function renderReport(md) {
  // 如果 marked 库加载失败或解析异常，回退到原始 Markdown 文本，保证内容可见
  try {
    if (typeof marked === "undefined") throw new Error("marked 未加载");
    $("#report").innerHTML = marked.parse(md);
  } catch (e) {
    $("#report").innerHTML = `<pre style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;">${md.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>`;
  }
}

function handleEvent(ev) {
  if (ev.type === "node") {
    setRole(ev.node, "active");
    const chip = roles.querySelector(`[data-r="${ev.node}"]`);
    if (chip) chip.dataset.ms = `${ev.ms}ms`;
    // 节点完成（下一个节点开始时，上一个即视为完成）
    setTimeout(() => setRole(ev.node, "done"), 50);
  } else if (ev.type === "done") {
    lastReport = ev.report || "";
    lastMetrics = ev.metrics || {};
    renderReport(lastReport);
    renderMetrics(lastMetrics);
    appendLog("🎉 报告生成完成", "n");
    $("#go").disabled = false;
  }
}

$("#go").addEventListener("click", async () => {
  const goal = $("#goal").value.trim();
  if (!goal) { alert("请填写主题"); return; }

  // 重置 UI
  roles.querySelectorAll(".chip").forEach((c) => c.classList.remove("active", "done"));
  log.textContent = "";
  $("#metrics").innerHTML = "";
  $("#report").innerHTML = '<p class="hint">生成中…</p>';
  $("#go").disabled = true;

  const payload = {
    goal,
    provider: $("#provider").value,
    max_iteration: Number($("#max_iteration").value),
    api_key: $("#api_key").value.trim() || undefined,
    base_url: $("#base_url").value.trim() || undefined,
    docs_dir: $("#docs_dir").value.trim() || undefined,
  };

  try {
    const res = await fetch("/api/generate/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok || !res.body) {
      appendLog(`⚠️ 请求失败（HTTP ${res.status}）`, "");
      $("#go").disabled = false;
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const dataLine = frame.split("\n").find((l) => l.startsWith("data:"));
        if (!dataLine) continue;
        let ev;
        try { ev = JSON.parse(dataLine.slice(5).trim()); } catch { continue; }
        handleEvent(ev);
      }
    }
  } catch (e) {
    appendLog("⚠️ 连接中断：" + e, "");
    $("#go").disabled = false;
  }
});

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

document.querySelectorAll(".xbtn").forEach((btn) => {
  btn.addEventListener("click", async () => {
    if (!lastReport) { alert("请先生成报告再导出"); return; }
    const fmt = btn.dataset.fmt;
    btn.disabled = true;
    try {
      const res = await fetch("/api/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ report: lastReport, metrics: lastMetrics, format: fmt }),
      });
      if (!res.ok) { alert("导出失败（HTTP " + res.status + "）"); return; }
      const blob = await res.blob();
      const cd = res.headers.get("Content-Disposition") || "";
      const m = cd.match(/filename="?([^"]+)"?/);
      downloadBlob(blob, m ? m[1] : "report." + fmt);
    } catch (e) {
      alert("导出失败：" + e);
    } finally {
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
